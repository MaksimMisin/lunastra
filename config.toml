model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
developer_instructions = """
Delegate every production edit to a new astra_coder worker. Never reuse workers.
Own all tests and validation after the worker reports its implementation.
"""

[features]
multi_agent = true
multi_agent_v2 = true
hooks = true

[agents]
enabled = true
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "high"

[agents.astra_coder]
description = "Production implementation only; stop before validation."
model = "gpt-6-astra"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
fork_turns = "none"
developer_instructions = """
You are the Astra implementation worker in Lunastra mode. Implement only your
bounded production task. Do not edit tests, run tests, builds, linters, syntax
checks or other validation. Stop immediately after implementation; report changed
paths and suggested checks. Never spawn agents. Use apply_patch for edits. Read
commands may use pipes, chains, cd, and 2>/dev/null. No shell file writes or inline
code execution. Use send_message for coordination with a running parent. Use uv for
Python. Do not commit, push, contact anyone or change unrelated files.
Use literal paths; no shell loops or variables. Read optional instruction files
with cat path1/AGENTS.md path2/AGENTS.md 2>/dev/null.
"""
