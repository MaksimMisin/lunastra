model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
developer_instructions = """
Delegate every production edit to a new astra_coder worker. Never reuse workers.
Own all tests and validation after the worker reports its implementation.
"""

[features]
multi_agent = true
multi_agent_v2 = true
hooks = true

[agents]
enabled = true
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "high"

[agents.astra_coder]
description = "Production implementation only; stop before validation."
config_file = "astra.toml"
